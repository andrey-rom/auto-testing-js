name: Playwright Tests

on:
  push:
    branches: [ main, ui-test ]
  pull_request:
    branches: [ main, ui-test ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - width: 1920
            height: 1080
          - width: 1366
            height: 768
        browser: [chromium, firefox]
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    
    - name: Run Playwright tests
      env:
        VIEWPORT_WIDTH: ${{ matrix.viewport.width }}
        VIEWPORT_HEIGHT: ${{ matrix.viewport.height }}
        CI: true
      run: npx playwright test --project=${{ matrix.browser }}
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}-${{ matrix.viewport.width }}x${{ matrix.viewport.height }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ matrix.browser }}-${{ matrix.viewport.width }}x${{ matrix.viewport.height }}
        path: test-results/**/*.png
        retention-days: 30
